[project]
name = "test-livekit"
version = "0.1.0"
description = "LiveKit Agents terminal sample"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "livekit-agents[openai]~=1.8",
    "python-dotenv>=1.1,<2",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
