[project]
name = "test-livekit"
version = "0.1.0"
description = "LiveKit Agents terminal sample"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "livekit-agents[openai]~=1.8",
    "python-dotenv>=1.1,<2",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "google-api-python-client>=2.160,<3",
    "google-auth-oauthlib>=1.2,<2",
    "opentelemetry-sdk>=1.28,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.28,<2",
    "psycopg[binary]>=3.2,<4",
    "sqlalchemy[asyncio]>=2.0,<3",
    "alembic>=1.14,<2",
    "pgvector>=0.3,<1",
    "httpx>=0.28,<1",
    "pydantic>=2.10,<3",
    "pypdf>=5.0,<7",
    "langchain-text-splitters>=0.3,<2",
    "deepeval>=4.3.4",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "reportlab>=4.2,<5"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
