name: CI and Cloudflare deployment

# Local development mode: automatic CI/CD is paused.
# Manual runs execute checks only; deployment remains disabled.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Test-LiveKit
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: uv sync --locked
      - run: uv run --locked pytest -q
      - run: uv run --locked python -m py_compile agent.py observability.py gmail_tools.py token_server.py container_agent.py

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fronted-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fronted-test/package-lock.json
      - run: npm ci
      - run: npm run build

  worker:
    name: Worker type check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json
      - run: npm ci
      - run: npm run check

  deploy:
    name: Deploy to Cloudflare
    needs: [python, frontend, worker]
    if: ${{ false }} # Paused while developing locally.
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fronted-test/package-lock.json
      - name: Build browser application
        working-directory: fronted-test
        run: |
          npm ci
          npm run build
      - name: Install Cloudflare deployment tools
        run: npm ci
      - name: Deploy Worker and Container
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
